version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross

  # 应用版本（唯一事实源：build/config.yml 的 info.version）。
  # 同时供：-X 注入 Go 的 app.Version、NSIS/MSI 产物名与元数据、便携包目录名。
  VERSION:
    sh: |
      sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # CGO 是既定基线（docs/ARCHITECTURE.md ADR-01）：本地推理（sherpa-onnx）与
      # Windows 音频捕获都依赖 CGO，因此默认 1。纯在线精简产物（nollm）才显式传 0。
      CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.BIN_NAME}}.exe"'
      - task: copy:runtime:dlls
        vars:
          CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # -X 注入版本号：Go 侧拿不到 build/config.yml，只能构建期注入（见 internal/app/version.go）。
      # 与前端 __APP_VERSION__、NSIS/MSI/便携包的版本号同源。
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l" -ldflags="-X ''vip.oberon.mandaryn/internal/app.Version={{.VERSION}}''"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X ''vip.oberon.mandaryn/internal/app.Version={{.VERSION}}''"{{end}}'
      # 产物名：默认就是 APP_NAME（`bin/mandaryn.exe`），只有派生变体（nollm）才覆盖，
      # 这样变体与标准产物不会互相覆盖，标准构建的输出路径与命名保持不变。
      DEFAULT_BIN_NAME: '{{.APP_NAME}}'
      BIN_NAME: '{{.BIN_NAME | default .DEFAULT_BIN_NAME}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  copy:runtime:dlls:
    summary: 把 CGO 运行时 DLL（sherpa-onnx / onnxruntime）拷到产物目录
    internal: true
    desc: |
      sherpa-onnx-go-windows 只提供导入库，运行时需要 3 个 DLL 与 exe 同目录：
      sherpa-onnx-c-api.dll / sherpa-onnx-cxx-api.dll / onnxruntime.dll。
      不拷贝会表现为「双击无反应」或 exit 127（无任何输出）。

      `CGO_ENABLED=0`（nollm 精简产物）不链接 sherpa-onnx，因而不需要这些 DLL，
      本任务直接跳过，避免在 bin/ 里留下一堆产物根本用不到的库。
    vars:
      CGO_ENABLED: '{{.CGO_ENABLED | default "1"}}'
    cmds:
      - cmd: |
          set -e
          if [ "{{.CGO_ENABLED}}" = "0" ]; then
            echo "CGO_ENABLED=0（nollm 精简产物）：不链接 sherpa-onnx，跳过运行时 DLL 拷贝"
            exit 0
          fi
          MODCACHE="$(go env GOMODCACHE)"
          DEST="{{.BIN_DIR}}"
          mkdir -p "$DEST"
          found=0
          for d in "$MODCACHE"/github.com/k2-fsa/sherpa-onnx-go-windows@*/lib/x86_64-pc-windows-gnu; do
            if [ -d "$d" ]; then
              cp -f "$d"/*.dll "$DEST"/ && found=1
            fi
          done
          if [ "$found" = "1" ]; then
            echo "CGO 运行时 DLL 已拷贝到 $DEST"
          else
            echo "警告：未找到 sherpa-onnx 运行时 DLL（未引入该依赖时可忽略）"
          fi
        platforms: [windows]

  build:nollm:
    summary: 构建 nollm 精简产物（仅在线引擎，不含本地推理）
    desc: |
      与 `build` 同一条 `go build` 命令**派生**，只差两处：
        - `EXTRA_TAGS` 追加 `nollm`：`internal/asr/local` 与 `internal/speaker/sherpa`
          的 sherpa-onnx 实现被 `//go:build !nollm` 排除，改链恒失败桩
          （返回 ERR_LOCAL_UNAVAILABLE，不静默降级去调在线引擎）；
        - `CGO_ENABLED=0`：不链接 sherpa-onnx / onnxruntime，也不需要那 3 个运行时 DLL。
      产物是 `bin/mandaryn-nollm.exe`，与标准产物 `bin/mandaryn.exe` 互不覆盖。

      **nollm 是体积敏感场景的可选产物，不是 CGO 兜底**（ADR-01）：
      它在没有本地推理的情况下就是不可用，不得用它去绕过任何构建问题。
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
          CGO_ENABLED: "0"
          BIN_NAME: "{{.APP_NAME}}-nollm"
          EXTRA_TAGS: '{{if .EXTRA_TAGS}}{{.EXTRA_TAGS}},{{end}}nollm'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application
    desc: |
      FORMAT=nsis（默认）→ NSIS 安装程序：面向普通用户，支持 user/machine 范围与多语言。
      FORMAT=msi           → MSI 安装包（WiX）：面向企业 GPO/SCCM/Intune 分发。
      FORMAT=portable      → 便携 zip：解压即用，数据写在 exe 同级 data\。
      FORMAT=msix          → MSIX 包（需代码签名证书才能安装）。

      NSIS 与 MSI **二选一**：两者各写一套 ARP 条目，同时装会出现两个「Mandaryn」。
      便携 zip 与它们**可共存**（不写注册表、不建快捷方式）。

      **构建只在这里做一次**：create:* 任务本身不依赖 build，只要求 bin/mandaryn.exe
      已存在。这一点对签名流程是必须的 —— CI 里已签名的 exe 从签名机取回后，
      若打包阶段再跑一次 build，`go build -o bin/mandaryn.exe` 会把已签名的 exe
      覆盖成未签名版本，最终装进安装器的就是没有签名的 exe（签名段全部白做）。
    deps:
      - task: build
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else if eq (.FORMAT | default "nsis") "msi"}}create:msi:package{{else if eq (.FORMAT | default "nsis") "portable"}}create:portable:zip{{else}}create:nsis:installer{{end}}'
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  create:portable:zip:
    summary: Creates a portable zip (exe + runtime DLLs + notices + data\)
    desc: |
      解压即用：不写注册表、不建快捷方式、数据写在 exe 同级 data\（便携模式）。

      包里含 3 个运行时 DLL（必须与 exe 同目录）与许可声明；data\ 内放一个 README，
      保证解压后该目录存在 —— 空目录在部分解压工具里会被丢弃，那样便携模式就不会触发。
    preconditions:
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
        msg: "bin/ 里缺少 {{.APP_NAME}}.exe：先跑 wails3 task build（create:* 不再代跑构建）"
      - sh: 'command -v wix >/dev/null 2>&1 || ls -d "/c/Program Files/WiX Toolset v"*/bin/wix.exe >/dev/null 2>&1 || ls -d "/c/Program Files (x86)/WiX Toolset v"*/bin/wix.exe >/dev/null 2>&1'
        msg: "未找到 WiX（wix.exe）：请安装 WiX Toolset v4+（CI: choco install wixtoolset）"
      # 与 NSIS 同样的断言：缺 DLL 直接失败，避免做出「能装但起不来」的包。
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/sherpa-onnx-c-api.dll" && test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/sherpa-onnx-cxx-api.dll" && test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/onnxruntime.dll"'
        msg: "bin/ 里缺少 CGO 运行时 DLL（sherpa-onnx-* / onnxruntime）：先跑 wails3 task build"
    cmds:
      - cmd: |
          set -e
          if [ -z "{{.VERSION}}" ]; then
            echo "无法从 build/config.yml 读取 info.version" >&2
            exit 1
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/build/windows/portable.ps1" \
            -Version "{{.VERSION}}" \
            -BinDir "{{.ROOT_DIR}}\{{.BIN_DIR}}" \
            -RootDir "{{.ROOT_DIR}}" \
            -OutFile "{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}-{{.VERSION}}-windows-{{.ARCH}}-portable.zip"
        platforms: [windows]

  create:msi:package:
    summary: Creates an MSI package (WiX)
    desc: |
      面向企业分发（GPO / SCCM / Intune）：perMachine 安装到
      %ProgramFiles%\Oberon\Mandaryn，含 3 个运行时 DLL 与许可声明，
      创建桌面与开始菜单快捷方式，支持 MajorUpgrade（降级被拒）。

      需要 WiX Toolset（v4+）：`wix --version` 应可用；CI 用 `choco install wixtoolset`。
      签名 MSI 必须用 signtool（wails3 内置签名器不支持 MSI）。
    preconditions:
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
        msg: "bin/ 里缺少 {{.APP_NAME}}.exe：先跑 wails3 task build（create:* 不再代跑构建）"
      - sh: 'command -v wix >/dev/null 2>&1 || ls -d "/c/Program Files/WiX Toolset v"*/bin/wix.exe >/dev/null 2>&1 || ls -d "/c/Program Files (x86)/WiX Toolset v"*/bin/wix.exe >/dev/null 2>&1'
        msg: "未找到 WiX（wix.exe）：请安装 WiX Toolset v4+（CI: choco install wixtoolset）"
      # 与 NSIS 同样的断言：缺 DLL 直接失败，避免做出「能装但起不来」的包。
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/sherpa-onnx-c-api.dll" && test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/sherpa-onnx-cxx-api.dll" && test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/onnxruntime.dll"'
        msg: "bin/ 里缺少 CGO 运行时 DLL（sherpa-onnx-* / onnxruntime）：先跑 wails3 task build"
    cmds:
      - cmd: |
          set -e
          if [ -z "{{.VERSION}}" ]; then
            echo "无法从 build/config.yml 读取 info.version" >&2
            exit 1
          fi
          # 定位 wix.exe：优先 PATH（CI 的 choco 安装可能已加入），
          # 否则在 "Program Files\WiX Toolset v*" 里找 —— 不写死版本号，
          # 因为 choco 装出来的可能是 v4/v5/v6，写死会让 CI 在版本变化时静默失败。
          WIX=""
          if command -v wix >/dev/null 2>&1; then
            WIX="wix"
          else
            for cand in "/c/Program Files/WiX Toolset v"*/bin/wix.exe \
                        "/c/Program Files (x86)/WiX Toolset v"*/bin/wix.exe; do
              if [ -x "$cand" ]; then WIX="$cand"; break; fi
            done
          fi
          if [ -z "$WIX" ]; then
            echo "未找到 wix.exe：请安装 WiX Toolset v4+（CI: choco install wixtoolset）" >&2
            exit 1
          fi
          echo "使用 WiX：$WIX ($("$WIX" --version 2>/dev/null | head -1))"
          # 许可 RTF 由 LICENSE 生成（单处来源，避免两份文本漂移）
          bash "{{.ROOT_DIR}}/build/windows/msi/make-license-rtf.sh"
          # UI / Util 扩展**必须锁版本**：不指定版本会拉到 7.x，与 WiX v6 不兼容
          # （报 WIX6101: Could not find expected package root folder wixext6）。
          "$WIX" extension add WixToolset.UI.wixext/6.0.2   >/dev/null 2>&1 || true
          "$WIX" extension add WixToolset.Util.wixext/6.0.2 >/dev/null 2>&1 || true
          "$WIX" build build/windows/msi/product.wxs \
            -arch x64 \
            -ext WixToolset.UI.wixext \
            -ext WixToolset.Util.wixext \
            -culture zh-cn \
            -loc build/windows/msi/zh-cn.wxl \
            -d Version="{{.VERSION}}" \
            -d BinDir="{{.ROOT_DIR}}/{{.BIN_DIR}}" \
            -d RootDir="{{.ROOT_DIR}}" \
            -d BuildDir="{{.ROOT_DIR}}/build" \
            -o "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msi"
          echo "MSI 已生成：{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msi（version={{.VERSION}}）"
        platforms: [windows]
    vars:
      # 必须显式声明：本任务被直接调用（CI 里为了不覆盖已签名 exe 而绕过 package）
      # 时拿不到 wails3 task 包装注入的 ARCH，产物名会变成 mandaryn-.msi。
      ARCH: '{{.ARCH | default ARCH}}'
      VERSION:
        sh: |
          sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
        msg: "bin/ 里缺少 {{.APP_NAME}}.exe：先跑 wails3 task build（create:* 不再代跑构建）"
      # 前置断言：DLL 必须已经由 copy:runtime:dlls 拷到 bin/。
      # 直接失败比装出一个「缺 DLL 的安装包」好得多 —— 那类问题要等用户双击才暴露。
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/sherpa-onnx-c-api.dll" && test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/sherpa-onnx-cxx-api.dll" && test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/onnxruntime.dll"'
        msg: "bin/ 里缺少 CGO 运行时 DLL（sherpa-onnx-* / onnxruntime）：先跑 wails3 task build"
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      # ARG_WAILS_<ARCH>_DLLS / ARG_WAILS_LICENSE 必须传：安装器要把 3 个 CGO 运行时 DLL
      # 与 LICENSE 装进安装目录（与 exe 同目录）。少了这些 define，wails_tools.nsh 里的
      # File 指令会在编译期报 undefined，或（若被注释）装出「缺 DLL 无法启动」的包。
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" -DARG_WAILS_{{.ARG_FLAG}}_DLLS="{{.ROOT_DIR}}\{{.BIN_DIR}}" -DARG_WAILS_LICENSE="{{.ROOT_DIR}}\LICENSE" -DARG_WAILS_THIRD_PARTY="{{.ROOT_DIR}}\build\third-party" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" -DARG_WAILS_{{.ARG_FLAG}}_DLLS="{{.ROOT_DIR}}/{{.BIN_DIR}}" -DARG_WAILS_LICENSE="{{.ROOT_DIR}}/LICENSE" -DARG_WAILS_THIRD_PARTY="{{.ROOT_DIR}}/build/third-party" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  create:msix:package:
    summary: Creates an MSIX package
    preconditions:
      - sh: 'test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
        msg: "bin/ 里缺少 {{.APP_NAME}}.exe：先跑 wails3 task build（create:* 不再代跑构建）"
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/build/config.yml" \
          --name "{{.APP_NAME}}.exe" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if eq .USE_MSIX_TOOL "true"}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    cmds:
      # Certificate vars are optional: if unset, `wails3 tool sign` falls back to
      # the certificate configured globally via `wails3 setup`.
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate "{{.SIGN_CERTIFICATE}}"{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint "{{.SIGN_THUMBPRINT}}"{{end}} {{if .TIMESTAMP_SERVER}}--timestamp "{{.TIMESTAMP_SERVER}}"{{end}}

  sign:installer:
    summary: Signs the NSIS installer
    desc: |
      Creates and signs the NSIS installer.
      Set SIGN_CERTIFICATE or SIGN_THUMBPRINT to override the certificate
      configured globally via `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      # create:nsis:installer 不再代跑构建（见 package 任务说明），这里显式补上
      - task: build
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
