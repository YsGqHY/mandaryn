name: Release (Multi-platform)

# ─────────────────────────────────────────────────────────────────────────────
# 本工作流负责 Windows / Linux / macOS 三平台的产物构建，并可发布到 GitHub Release。
#
# 与现有 .github/workflows/release.yml 的分工（重要，别搞混）：
#   release.yml              —— Windows **带代码签名**的正式发版线：exe 签名 → NSIS/MSI/便携
#                                zip → 签安装器 → 发布（依赖 self-hosted Ubuntu 签名机 +
#                                osslsigncode，见其顶部注释）
#   release-multiplatform.yml —— 三平台构建 + 发布（本文件）；Windows 产物**不做代码签名**
#
# 为什么两条都保留：本文件的 Windows job 单 job 直出（没有签名时序约束），十几分钟就能
# 拿到三平台全部产物；release.yml 那条链有 5 段签名闸门（签 exe 必须先于打包），只有在
# 证书 / 令牌就位、要消除「未知发布者」提示的正式包时才跑它。两者用的是同一个 tag，
# **不要同时手动触发**，否则会互相覆盖同一个 Release 的资产。
#
# 触发为什么只有 workflow_dispatch（沿用 NarraFork 的做法）：
#   release.yml 已经监听 tag push。如果本文件也监听 v* tag，一次打 tag 会同时跑两条
#   发布流水线，产生重复 Release 或互相覆盖资产。改成纯手动触发后两条流水线可以并存，
#   由人在确认 Linux 产物文件名之后再手动发布。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '创建（草稿）GitHub Release。首次运行请保持关闭，先确认 Linux 产物文件名'
        type: boolean
        default: false
      version_hint:
        description: '可选：期望的版本号（留空则以 build/config.yml 的 info.version 为准）'
        type: string
        default: ''
      retention_days:
        description: '构建产物在 Actions 中的保留天数'
        type: string
        default: '7'

permissions:
  contents: write

concurrency:
  # 与 release.yml 用不同的 group：两者互不阻塞，但仍保证同一条流水线不被并发覆盖。
  # 不取消进行中的运行：构建 + 发布可重入性差，中途取消更容易留下半成品 Release。
  group: release-multiplatform
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.5.0'
  # 必须与 go.mod 的 wails/v3 版本一致（CI 里若用旧版 CLI 会生成不匹配的 bindings）
  WAILS_VERSION: 'v3.1.0'

jobs:
  # ── 1) 预检：把版本号与构建矩阵收敛到一处 ────────────────────────────────────
  #
  # 沿用 NarraFork 的 preflight 结构：版本、矩阵、输入校验都在这里算一次，
  # 下游 job 通过 needs.*.outputs 消费，避免每个 job 各自 sed 一遍 config.yml 后出现分歧。
  preflight:
    name: 预检（版本与构建矩阵）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      linux_matrix: ${{ steps.meta.outputs.linux_matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号与构建矩阵
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # 版本唯一事实源：build/config.yml 的 info.version
          # （NSIS 的 INFO_PRODUCTVERSION、ldflags 注入、各包文件名都从它派生）
          ver="$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::无法从 build/config.yml 读取 info.version"; exit 1; }

          # 手工触发时允许用输入值覆盖，但要求两者一致，防止发出
          # 「文件名写 2.1.0、应用内显示 2.0.0」的产物
          hint='${{ inputs.version_hint }}'
          if [ -n "$hint" ] && [ "$hint" != "$ver" ]; then
            echo "::error::输入的 version_hint=$hint 与 config.yml 的 info.version=$ver 不一致"
            exit 1
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "解析到版本号：$ver"

          # Linux 构建矩阵。arm64 用 GitHub 托管的 ARM runner（ubuntu-24.04-arm）。
          # 注意：ARM runner 目前对公开仓库开放；私有仓库需要相应套餐才可用，
          # 若不可用，把 arm64 项删掉即可（其余逻辑无需改动）。
          matrix='{"include":[
            {"arch":"amd64","runner":"ubuntu-24.04"},
            {"arch":"arm64","runner":"ubuntu-24.04-arm"}
          ]}'
          # 单行 JSON：GitHub 的 job outputs 不允许多行值
          echo "linux_matrix=$(echo "$matrix" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  # ── 2a) Linux 构建（amd64 / arm64 矩阵）─────────────────────────────────────
  #
  # 为什么必须原生 Linux runner：CGO（sherpa-onnx + GTK4）不允许跨平台编译（ADR-01）。
  # 与 ci.yml 的 linux-compile 区别：那个是 CGO_ENABLED=0 + purego 的编译门禁，不出包。
  build-linux:
    name: 构建 Linux (${{ matrix.arch }})
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false          # 一个架构失败不影响另一个架构出包，便于对比排查
      matrix: ${{ fromJSON(needs.preflight.outputs.linux_matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # GTK4 + WebKitGTK 6.0 是 Wails v3.1 的 Linux 默认栈（GTK3 旧栈已在 v3.1 移除）。
      # 必须是 -dev 包：cgo 阶段靠 pkg-config 找头文件，只装运行时不编译不过。
      - name: 安装 GTK4 / WebKitGTK 6.0 开发依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev libwebkitgtk-6.0-dev pkg-config build-essential file binutils

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # bindings 必须先于前端构建：前端 build 会引用 frontend/bindings 下的 TS 类型
      - name: 生成前端 bindings
        run: wails3 task common:generate:bindings

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # linux:package = build + create:appimage / create:deb / create:rpm / create:aur
      # AUR 产物（*.pkg.tar.*）暂不发布，靠下面的上传 glob 排除。
      - name: 构建并打包（AppImage / deb / rpm）
        run: wails3 task linux:package ARCH=${{ matrix.arch }}

      # 首次运行已确认真实文件名（2026-11-17，run 44027304467）：
      #   amd64: mandaryn-x86_64.AppImage / mandaryn.deb / mandaryn.rpm
      #   arm64: mandaryn-aarch64.AppImage / mandaryn.deb / mandaryn.rpm
      #
      # 关键：deb 与 rpm 在两个架构下**同名**。而 publish 会 merge-multiple 把两个
      # artifact 合进同一个 dist/，同名文件必然互相覆盖 —— 结果是只有一个架构的包
      # 活下来，SHA256SUMS 却看起来「正常」。所以在构建阶段就按
      # mandaryn-<ver>-linux-<arch>.<ext> 重命名，既消除覆盖，也统一命名。
      - name: 统一产物命名并断言（消除跨架构同名覆盖）
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.preflight.outputs.version }}"
          arch="${{ matrix.arch }}"
          cd bin
          case "$arch" in
            amd64) appimg="mandaryn-x86_64.AppImage";;
            arm64) appimg="mandaryn-aarch64.AppImage";;
            *) echo "::error::未知架构 $arch"; exit 1;;
          esac
          for f in "$appimg" mandaryn.deb mandaryn.rpm; do
            [ -f "$f" ] || { echo "::error::缺少产物 bin/$f"; ls -lh .; exit 1; }
          done
          mv -f "$appimg"        "mandaryn-${ver}-linux-${arch}.AppImage"
          mv -f mandaryn.deb     "mandaryn-${ver}-linux-${arch}.deb"
          mv -f mandaryn.rpm     "mandaryn-${ver}-linux-${arch}.rpm"
          echo "—— 重命名后的最终产物 ——"
          ls -1 "mandaryn-${ver}-linux-${arch}."*

      # 静态校验：确认架构正确，并实测「sherpa-onnx 是否静态链接」这个待确认项。
      # 若 NEEDED 里出现 sherpa/onnx，说明必须随包分发 .so，当前打包方式会缺库。
      - name: 校验二进制架构与动态依赖
        shell: bash
        run: |
          set -euo pipefail
          echo "—— file ——"; file bin/mandaryn
          case "${{ matrix.arch }}" in
            amd64) want="x86-64";;
            arm64) want="aarch64";;
            *)     want="";;
          esac
          file bin/mandaryn | grep -qi "$want" || { echo "::error::二进制架构不是 ${{ matrix.arch }}（期望 $want）"; exit 1; }

          echo "—— NEEDED 动态库清单 ——"
          readelf -d bin/mandaryn | grep -E "NEEDED" || true
          if readelf -d bin/mandaryn | grep -iE "sherpa|onnx"; then
            echo "::error::二进制依赖 sherpa/onnx 动态库：需随包分发 .so（当前打包未包含），修好后再发版"
            exit 1
          fi
          echo "符合预期：未出现 sherpa/onnx 的 NEEDED 条目（即静态链接，无需分发 .so）"

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-${{ matrix.arch }}
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          path: |
            bin/mandaryn-${{ needs.preflight.outputs.version }}-linux-${{ matrix.arch }}.AppImage
            bin/mandaryn-${{ needs.preflight.outputs.version }}-linux-${{ matrix.arch }}.deb
            bin/mandaryn-${{ needs.preflight.outputs.version }}-linux-${{ matrix.arch }}.rpm

  # ── 2b) macOS 构建（universal dmg，未签名）──────────────────────────────────
  #
  # 本项目没有付费 Apple Developer ID：没有 Developer ID 证书、也不做公证。
  # dmg 内的 .app 走 ad-hoc 签名（codesign -s -），Gatekeeper 会拦截，
  # 用户需手动「右键 → 打开」。发布说明必须写清这一步。
  build-macos:
    name: 构建 macOS（universal dmg，未签名）
    needs: [preflight]
    # 标签选择依据（勿随手改回 macos-14）：
    #   GitHub 官方 runner-images 文档：所有 macOS 14 镜像已于 2026-11-02 从
    #   GitHub Actions 退役（Intel 版仅在 Azure DevOps 延至 2026-11-23）。
    #   使用已退役标签时，job 永远匹配不到 runner —— 表现为 started 后 1 秒内
    #   cancelled、runner_id=0、零步骤执行，且没有任何报错日志。
    #   macos-15 为 arm64 GA 镜像，可用 macOS SDK 交叉产出 amd64 切片供 lipo 合并。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Info.plist 里的版本是硬编码的（与 nfpm.yaml 同类）。这里断言它与 config.yml
      # 一致，避免 drift 成「dmg 名 2.1.0、应用内 CFBundleShortVersionString 2.0.0」。
      - name: 断言 Info.plist 版本与 config.yml 一致
        shell: bash
        run: |
          set -euo pipefail
          plist_ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/darwin/Info.plist)"
          cfg_ver="${{ needs.preflight.outputs.version }}"
          echo "Info.plist=$plist_ver config.yml=$cfg_ver"
          [ "$plist_ver" = "$cfg_ver" ] || {
            echo "::error::build/darwin/Info.plist ($plist_ver) 与 config.yml ($cfg_ver) 版本不一致"
            exit 1
          }

      # 权限声明缺失会让 macOS 在首次取音频时直接终止进程（不是报错，是 kill）。
      # 这里显式断言，避免有人把 Info.plist 精简掉后发出「装了但打不开麦克风」的 dmg。
      - name: 断言音频权限声明存在
        shell: bash
        run: |
          set -euo pipefail
          for k in NSMicrophoneUsageDescription NSAudioCaptureUsageDescription; do
            v="$(/usr/libexec/PlistBuddy -c "Print :$k" build/darwin/Info.plist 2>/dev/null || true)"
            [ -n "$v" ] || { echo "::error::Info.plist 缺少 $k"; exit 1; }
            echo "$k OK"
          done

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 生成前端 bindings
        run: wails3 task common:generate:bindings

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 该任务内部顺序：build:universal → package:universal → codesign:bundle
      # → create:dmg → 重命名为 mandaryn-<ver>-macos-universal.dmg。
      # 刻意不用 darwin:package:dmg：它的 deps 会把 universal 二进制覆盖成单架构。
      - name: 构建 universal 应用并打包 dmg
        run: wails3 task darwin:package:dmg:universal

      - name: 校验 universal 架构与签名状态
        shell: bash
        run: |
          set -euo pipefail
          dmg="bin/mandaryn-${{ needs.preflight.outputs.version }}-macos-universal.dmg"
          test -f "$dmg" || { echo "::error::缺少产物 $dmg"; ls -lh bin/ || true; exit 1; }
          ls -lh "$dmg"

          # lipo 必须同时列出两个架构，否则不是 universal
          archs="$(lipo -archs bin/mandaryn.app/Contents/MacOS/mandaryn)"
          echo "lipo archs = $archs"
          echo "$archs" | grep -q "x86_64"  || { echo "::error::缺少 x86_64 切片"; exit 1; }
          echo "$archs" | grep -q "arm64"   || { echo "::error::缺少 arm64 切片"; exit 1; }

          # 确认 ad-hoc 签名有效（这不是 Developer ID，Gatekeeper 仍会拦）
          codesign --verify --deep --strict --verbose=2 bin/mandaryn.app
          e="$(codesign -dv --verbose=2 bin/mandaryn.app 2>&1 | grep -E '^(Authority|Signature|TeamIdentifier)' || true)"
          echo "—— 签名信息 ——"; echo "$e"
          echo "::warning::本产物为 ad-hoc 签名且未公证；用户需「右键 → 打开」放行（详见 Release 说明）"

          # 实测「sherpa 是否静态链接」：若出现 sherpa/onnx 的 dylib 依赖，
          # 说明必须把 .dylib 放进 .app 的 Contents/Frameworks，当前行为会缺库。
          echo "—— otool -L __"
          otool -L bin/mandaryn.app/Contents/MacOS/mandaryn | sed -n '1,25p'
          if otool -L bin/mandaryn.app/Contents/MacOS/mandaryn | grep -iE "sherpa|onnx"; then
            echo "::error::二进制依赖 sherpa/onnx 动态库：需随 .app 分发 .dylib，修好后再发版"
            exit 1
          fi

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          path: bin/mandaryn-*-macos-universal.dmg

  # ── 2c) Windows 构建（NSIS / MSI / 便携 zip，未签名）────────────────────────
  #
  # 为什么单 job 直出，不像 release.yml 那样拆成 5 段：这里不签名，就没有
  # 「签 exe 必须先于打包」的时序约束。构建与打包放在同一个 job 反而更简单 ——
  # bin/ 里的 exe 与 3 个运行时 DLL 直接被 create:* 复用，不必上传再下载一遍。
  #
  # 为什么用 windows-latest 而不是交叉编译：CGO（sherpa-onnx + WebView2）不允许
  # 跨平台编译（ADR-01），Windows 产物必须在 Windows 上构建。
  build-windows:
    name: 构建 Windows（NSIS / MSI / 便携 zip，未签名）
    needs: [preflight]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 必须早于 setup-go：CGO 依赖 msys2 提供的 gcc / windres。
      # path-type: inherit 让 gcc 真正进 PATH，否则 go build 直接报 gcc not found。
      - name: 安装 MSYS2 工具链（gcc / windres）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 生成前端 bindings
        run: wails3 task common:generate:bindings

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 产出 bin/mandaryn.exe + 3 个 CGO 运行时 DLL（copy:runtime:dlls 由 build 带出）
      - name: 构建（exe + 运行时 DLL）
        run: wails3 task build

      # 本项目最核心的回归断言：缺任何一个 DLL，装出来的程序双击即报
      # 「找不到 sherpa-onnx-c-api.dll」（导入表在 main 之前解析）。
      - name: 断言运行时 DLL 就位
        shell: bash
        run: |
          set -euo pipefail
          for f in sherpa-onnx-c-api.dll sherpa-onnx-cxx-api.dll onnxruntime.dll; do
            test -f "bin/$f" || { echo "::error::缺少 bin/$f"; exit 1; }
          done
          ls -lh bin/*.dll

      # 两个打包工具，两类坑（都是 2026-11-17 实测踩到的）：
      #
      # ① NSIS：choco 把它装到 "C:\Program Files (x86)\NSIS"，但**同一 job 内后续步骤
      #    读不到这次 PATH 变更** —— runner 进程的环境在 job 开始时已快照，choco 改的是
      #    机器级 PATH。症状是 `"makensis": executable file not found in $PATH`（exit 127）。
      #    必须显式写进 $GITHUB_PATH，那只对后续步骤生效。
      #
      # ② WiX：镜像预装了 wixtoolset v3.14，choco 判定「already installed」直接跳过。
      #    而 create:msi:package 用的是 WiX v4+ 的 `wix.exe build`（v3 只有 candle/light），
      #    所以拿 choco 那个 v3 是错的。改用 dotnet tool 装 wix（v6），它落在
      #    %USERPROFILE%\.dotnet\tools\wix.exe，同一套 $GITHUB_PATH 机制即可命中
      #    任务里的 `command -v wix` 探测；扩展版本仍由任务内部锁到 6.0.2，这里不写死。
      - name: 安装打包工具（NSIS + WiX v6）
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          dotnet tool install --global wix --version 6.*
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 断言工具真的可用：PATH 这类问题要在打包前暴露，而不是等到 makensis / wix
      # 各自报一句不指向根因的错误。
      - name: 断言打包工具可用
        shell: bash
        run: |
          set -euo pipefail
          command -v makensis || { echo "::error::makensis 不在 PATH"; exit 1; }
          makensis -VERSION
          command -v wix || { echo "::error::wix 不在 PATH"; exit 1; }
          wix --version

      # 直调 create:*（不用 windows:package）：package 带 build 依赖会重跑 go build，
      # 本 job 虽未签名、重建也无害，但 exe 已经构建好，多跑一次只是白等几分钟。
      # 任务全名带平台前缀（windows:），没有去前缀的别名。
      - name: 打三产物（NSIS / MSI / 便携 zip）
        shell: bash
        run: |
          set -euo pipefail
          wails3 task windows:create:nsis:installer INSTALL_SCOPE=machine
          wails3 task windows:create:msi:package
          wails3 task windows:create:portable:zip

      - name: 校验产物齐全并记录签名状态
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.preflight.outputs.version }}"
          for f in "mandaryn-${ver}-windows-amd64-installer.exe" \
                   "mandaryn-${ver}-windows-amd64.msi" \
                   "mandaryn-${ver}-windows-amd64-portable.zip"; do
            test -f "bin/$f" || { echo "::error::缺少产物 bin/$f"; ls -lh bin/; exit 1; }
          done
          ls -lh "bin/mandaryn-${ver}-windows-amd64-installer.exe" \
                 "bin/mandaryn-${ver}-windows-amd64.msi" \
                 "bin/mandaryn-${ver}-windows-amd64-portable.zip"

          # 本 job 刻意不做代码签名（没有证书）。这里如实打印状态，
          # 避免 Release 说明与产物实际状态不符；签名版走 release.yml。
          for f in "bin/mandaryn-${ver}-windows-amd64-installer.exe" "bin/mandaryn-${ver}-windows-amd64.msi"; do
            powershell -NoProfile -Command "(Get-AuthenticodeSignature '$f').Status" \
              | sed "s|^|$f -> |"
          done
          echo "::warning::Windows 三产物未做代码签名，SmartScreen 会提示「未知发布者」（Release 说明需写明）"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          path: |
            bin/mandaryn-${{ needs.preflight.outputs.version }}-windows-amd64-installer.exe
            bin/mandaryn-${{ needs.preflight.outputs.version }}-windows-amd64.msi
            bin/mandaryn-${{ needs.preflight.outputs.version }}-windows-amd64-portable.zip

  # ── 3) 汇总发布（默认关闭；确认产物文件名后再打开）──────────────────────────
  #
  # 沿用 NarraFork 的「发布由输入开关控制」模型：默认 publish=false，只上传 Actions 产物，
  # 不创建 Release。等产物文件名被确认、断言收紧之后，再手动勾选发布。
  #
  # 本 job 发布三平台全部产物。Windows 产物是**未签名**的；需要带 Authenticode 签名的
  # 正式 Windows 包时走 release.yml（同一 tag 不要两条同时触发）。
  publish:
    name: 发布（Windows + Linux + macOS 草稿 Release）
    needs: [preflight, build-linux, build-macos, build-windows]
    if: inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 需要 checkout：正文从 docs/release-notes/v<version>.md 读取（见下）
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist

      - name: 列出待发布文件
        shell: bash
        run: |
          set -euo pipefail
          ls -lhR dist

      # 校验和必须在所有签名/打包之后生成（此处无后续签名步骤，故放在发布前一次算完）。
      # 用 glob 而非写死名字，理由同前：Linux 文件名尚未确认。
      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # 排除可能存在的 *.txt（例如上一轮遗留），只对二进制产物求哈希
          mapfile -t files < <(ls -1 | grep -vE '\.txt$' || true)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::没有可发布的产物"; exit 1; }
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      # 正文来源：docs/release-notes/v<version>.md —— 按版本手写，结构参照 NarraFork
      # 的 releases（「快速下载」表 → 简体中文 → English → 完整性校验）。
      #
      # 为什么不用内联 body：正文含「新功能 / 改进 / 修复 / 升级说明」，这些是**每版不同**
      # 的内容，写进工作流只会变成永不过期的旧文案（上一版留下的正文会被下一版照抄）。
      # 落到仓库文件后，发版前 review 的就是最终要发出去的文本，且随 PR 一起评审。
      #
      # 缺文件时退回内联骨架并告警，而不是让整次发布失败：产物已经构建好，
      # 草稿本来就是给人再核对和补写的。
      - name: 准备 Release 正文
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ needs.preflight.outputs.version }}"
          mkdir -p notes
          f="docs/release-notes/v${ver}.md"
          if [ -f "$f" ]; then
            cp "$f" notes/body.md
            echo "使用仓库内版本文案：$f"
          else
            echo "::warning::未找到 $f，退回内联骨架（请在 docs/release-notes/ 补该版本文案）"
            cat > notes/body.md <<EOF
          ## 快速下载

          本 Release 包含 Windows / Linux / macOS 三平台产物，详见下方 Assets。

          - Windows：\`mandaryn-${ver}-windows-amd64-installer.exe\`（NSIS）、\`.msi\`、\`-portable.zip\`
          - macOS：\`mandaryn-${ver}-macos-universal.dmg\`（universal）
          - Linux：\`mandaryn-${ver}-linux-<arch>.AppImage\` / \`.deb\` / \`.rpm\`（amd64 / arm64）

          Windows 与 macOS 产物均未做代码签名，首次运行会被 SmartScreen / Gatekeeper 拦截。

          ## 完整性校验

          \`\`\`
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF
          fi
          wc -c notes/body.md

      # 创建草稿 Release：draft=true 意味着不会立刻对外可见，给人最后一次核对机会。
      # fail_on_unmatched_files=false 是刻意的：某一平台的文件名将来若有调整，
      # 不该让已经构建好的其余平台产物发不出去；「确实有产物」由上一步的 SHA256SUMS 保证。
      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Mandaryn v${{ needs.preflight.outputs.version }}
          tag_name: v${{ needs.preflight.outputs.version }}
          fail_on_unmatched_files: false
          body_path: notes/body.md
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
