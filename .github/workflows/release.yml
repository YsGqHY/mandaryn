name: Release

# 触发：推送版本 tag（v*）或手动触发。
#   - tag 推送是**唯一**会创建 GitHub Release 的路径（避免误发）
#   - workflow_dispatch 默认只构建不发布，除非显式勾选 publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '创建（草稿）GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 签名与发布不允许被中途取消

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.5.0'
  WAILS_VERSION: 'v3.1.0'

# ─────────────────────────────────────────────────────────────────────────────
# 为什么这条流水线有 5 段，而不是 1 段
#
# 硬约束 ①：exe 必须在**打包之前**签名 —— NSIS/MSI 会把 exe 嵌进包里，
#           先打包后签 exe 时安装出来的仍是未签名程序。
# 硬约束 ②：打包只能在 Windows 做 —— CGO 构建与 WiX 的路径探测都绑定 Windows。
# 硬约束 ③：令牌插在 **Ubuntu** 签名机上，signtool 没有 Linux 版本。
#
# 三者交叠只能这样排：
#   build(windows) → sign-exe(ubuntu) → package(windows) → sign-installer(ubuntu) → publish(ubuntu)
#
# 未启用签名时（SIGNING_ENABLED 变量不为 true）走**短路径**：
#   build(windows) 直接把三产物打包完 → publish，签名相关 job 全部跳过。
# 也就是说：不配签名机也能发版，只是产物未签名。
#
# 启用签名需要准备：
#   1. Settings → Secrets and variables → Actions → Variables：SIGNING_ENABLED = true
#   2. Ubuntu 自托管 runner，标签 self-hosted, linux, signing，插好令牌、装好 osslsigncode
#   3. 该机器上放好 build/linux/signing.config（模板见 signing.config.example，不入库）
#   4. 建 environment `signing`，配 Required reviewers + 只允许 v* tag
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1) 构建（Windows）──────────────────────────────────────────────────────
  build:
    name: 构建（Windows）
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # tag 必须与 build/config.yml 的 info.version 一致，
      # 否则会发出"文件名写 2.1.0、应用内显示 2.0.0"的错误产物。
      - name: 校验 tag 与 config.yml 版本一致
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::无法读取 info.version"; exit 1; }
          echo "config.yml info.version = $ver"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag version = $tag"
            [ "$ver" = "$tag" ] || { echo "::error::tag ($tag) 与 config.yml ($ver) 不一致"; exit 1; }
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # 必须早于 setup-go：CGO 依赖 msys2 提供的 gcc
      - name: 安装 MSYS2 工具链（gcc / windres）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 生成前端 bindings
        run: wails3 task common:generate:bindings

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建（exe + 运行时 DLL）
        run: wails3 task build

      # 本项目最核心的回归断言：缺任何一个 DLL，装出来的程序双击即报
      # 「找不到 sherpa-onnx-c-api.dll」（导入表在 main 之前解析）。
      - name: 断言运行时 DLL 就位
        shell: bash
        run: |
          set -euo pipefail
          for f in sherpa-onnx-c-api.dll sherpa-onnx-cxx-api.dll onnxruntime.dll; do
            test -f "bin/$f" || { echo "::error::缺少 bin/$f"; exit 1; }
          done
          ls -lh bin/*.dll

      - name: 上传待签名 exe 与依赖
        uses: actions/upload-artifact@v4
        with:
          name: exe-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/mandaryn.exe
            bin/sherpa-onnx-c-api.dll
            bin/sherpa-onnx-cxx-api.dll
            bin/onnxruntime.dll

  # ── 1b) 构建（Linux）────────────────────────────────────────────────────────
  #
  # 为什么必须用 Linux runner 原生构建：CGO（sherpa-onnx + GTK）使然，
  # 本机与 Windows runner 都无法交叉编译（ADR-01）。
  #
  # 与 ci.yml 里 `linux-compile` 的区别：那个 job 只是 CGO_ENABLED=0 + purego 的
  # 编译门禁，不产出任何可分发的包；这里才真正出 AppImage / deb / rpm。
  build-linux:
    name: 构建（Linux）
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本号各 job 自行从 config.yml 读，避免为一个字符串把 Linux/macOS
      # 串行挂到 Windows 的 build 后面等。
      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::无法读取 info.version"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # Wails v3.1 的 Linux 默认栈是 GTK4 + WebKitGTK 6.0（GTK3 旧栈已在 v3.1 移除）。
      # 这里必须装 -dev 包：go build 阶段的 cgo 要 pkg-config 找到头文件。
      - name: 安装 GTK4 / WebKitGTK 6.0 开发依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev libwebkitgtk-6.0-dev pkg-config build-essential

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 生成前端 bindings
        run: wails3 task common:generate:bindings

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # linux:package = build + create:appimage/deb/rpm/aur。
      # AUR 产物（*.pkg.tar.*）我们不发，靠下面的上传 glob 排除。
      - name: 构建并打包（AppImage / deb / rpm）
        run: wails3 task linux:package

      # 断言语义：**不硬编码文件名**。AppImage 与 nfpm 的实际输出名由 CLI 决定，
      # 离线无法核实，所以这里用 glob 断言「每类至少一个」，并把 bin/ 全量打印出来，
      # 供首次运行时确认真实文件名（确认后再决定是否收紧成精确断言）。
      - name: 断言产物齐全（glob，输出名待实测确认）
        shell: bash
        run: |
          set -euo pipefail
          ls -lh bin/ || true
          for pat in 'bin/*.AppImage' 'bin/*.deb' 'bin/*.rpm'; do
            # shellcheck disable=SC2086
            compgen -G "$pat" > /dev/null || { echo "::error::缺少产物：$pat"; exit 1; }
          done
          echo "—— 实际产物文件名（首次运行请记录）——"
          ls -1 bin/*.AppImage bin/*.deb bin/*.rpm

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm

  # ── 1c) 构建（macOS，未签名 dmg）────────────────────────────────────────────
  #
  # 本项目**没有付费 Apple Developer ID**，因此没有 Developer ID 证书、也不做公证。
  # dmg 内的 .app 走 ad-hoc 签名（codesign -s -），Gatekeeper 会拦截，
  # 用户需手动「右键 → 打开」。Release 说明里必须写清这一步。
  #
  # 用 macos-14（Apple Silicon）：universal 构建需要 lipo 合并 amd64 + arm64，
  # Apple Silicon runner 的 macOS SDK 可同时产两个切片。
  build-macos:
    name: 构建（macOS universal dmg，未签名）
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -1)"
          [ -n "$ver" ] || { echo "::error::无法读取 info.version"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # 断言 Info.plist 的版本与 config.yml 一致。
      # Info.plist 里的版本是硬编码的（与 nfpm.yaml 同类），drift 会导致
      # 「dmg 文件名 2.1.0、应用内 CFBundleShortVersionString 2.0.0」。
      - name: 断言 Info.plist 版本与 config.yml 一致
        shell: bash
        run: |
          set -euo pipefail
          plist_ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/darwin/Info.plist)"
          cfg_ver="${{ steps.ver.outputs.version }}"
          echo "Info.plist=$plist_ver config.yml=$cfg_ver"
          [ "$plist_ver" = "$cfg_ver" ] || {
            echo "::error::build/darwin/Info.plist 的 CFBundleShortVersionString ($plist_ver) 与 config.yml ($cfg_ver) 不一致"
            exit 1
          }

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node 并缓存 pnpm store
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 生成前端 bindings
        run: wails3 task common:generate:bindings

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 该任务内部顺序：build:universal → package:universal → codesign:bundle
      # → create:dmg → 重命名为 mandaryn-<ver>-macos-universal.dmg。
      # 刻意不用 darwin:package:dmg（它的 deps 会把 universal 覆盖成单架构）。
      - name: 构建 universal 应用并打包 dmg
        run: wails3 task darwin:package:dmg:universal

      - name: 断言 dmg 与签名状态
        shell: bash
        run: |
          set -euo pipefail
          dmg="bin/mandaryn-${{ steps.ver.outputs.version }}-macos-universal.dmg"
          test -f "$dmg" || { echo "::error::缺少产物 $dmg"; ls -lh bin/ || true; exit 1; }
          ls -lh "$dmg"
          # 说明 ad-hoc 签名的实际结果（不是 Developer ID，Gatekeeper 仍会拦）
          codesign -dv --verbose=2 bin/mandaryn.app 2>&1 | sed -n '1,12p' || true
          echo "::warning::本产物未使用 Developer ID 签名、未公证：用户需「右键 → 打开」放行"
          # lipo 校验：确认确实是 universal（两个架构都在）
          lipo -archs bin/mandaryn.app/Contents/MacOS/mandaryn || true

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          retention-days: 7
          if-no-files-found: error
          path: bin/mandaryn-*-macos-universal.dmg

  # ── 2) 签 exe（Ubuntu 签名机；必须先于打包）────────────────────────────────
  sign-exe:
    name: 签 exe（Ubuntu 签名机）
    needs: build
    if: vars.SIGNING_ENABLED == 'true'
    runs-on: [self-hosted, linux, signing]
    timeout-minutes: 20
    # 人工批准闸门：即使工作流被改，没有批准也拿不到令牌
    environment: signing
    steps:
      - name: 检出代码（需要 build/linux/sign.sh）
        uses: actions/checkout@v4

      - name: 下载未签名 exe
        uses: actions/download-artifact@v4
        with: { name: exe-unsigned, path: bin }

      # 令牌/证书/私钥/时间戳一次性逐项自检，代替原先只查 osslsigncode + pcscd 的粗检。
      # 手工检查看不出「私钥不在卡里」「URI 的 label 写错」这类问题，签名时只会得到
      # 一句笼统报错；--preflight 会把每一项单独给结论。
      - name: 环境预检（令牌 / 证书 / 私钥 / 时间戳）
        run: |
          set -euo pipefail
          command -v osslsigncode >/dev/null || { echo "::error::缺少 osslsigncode（apt install osslsigncode）"; exit 1; }
          # pkcs11-tool 来自 opensc：没有它就查不了证书/私钥是否真在卡里
          command -v pkcs11-tool >/dev/null || echo "::warning::未装 opensc，预检将跳过证书/私钥检查"
          build/linux/sign.sh --preflight

      - name: 签 exe
        run: build/linux/sign.sh --target exe --input bin/mandaryn.exe

      - name: 上传已签名 exe
        uses: actions/upload-artifact@v4
        with:
          name: exe-signed
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/mandaryn.exe
            bin/sherpa-onnx-c-api.dll
            bin/sherpa-onnx-cxx-api.dll
            bin/onnxruntime.dll

  # ── 3) 打包（Windows）：用已签名的 exe 打三产物 ───────────────────────────
  package:
    name: 打包三产物（Windows）
    needs: [build, sign-exe]
    # sign-exe 被跳过（未启用签名）时也要能打包 —— 此时用未签名 exe
    if: always() && needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSYS2 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # 不再需要 pnpm / Node / bindings：打包已不构建（见下方「打三产物」说明），
      # exe 与运行时 DLL 全部来自构建/签名作业的产物。省掉这几步能显著缩短 CI 时间。

      # 用签名后的 exe 覆盖构建产物：打包任务会把 bin/mandaryn.exe 装进安装器
      # 启用了签名但签名失败时不能拿未签名 exe 往下走 —— 那样签出来的安装器里
      # 装的仍是未签名 exe，用户的 SmartScreen 提示照旧。
      - name: 拒绝继续（启用了签名但 exe 签名失败）
        if: vars.SIGNING_ENABLED == 'true' && needs.sign-exe.result != 'success'
        run: |
          echo "::error::SIGNING_ENABLED=true 但签 exe 作业结果=${{ needs.sign-exe.result }}，拒绝打包未签名 exe。"
          exit 1

      - name: 取回已签名 exe（启用签名时）
        if: needs.sign-exe.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: exe-signed, path: bin }

      - name: 取回未签名 exe（未启用签名时）
        if: needs.sign-exe.result == 'skipped'
        uses: actions/download-artifact@v4
        with: { name: exe-unsigned, path: bin }

      - name: 安装打包工具（NSIS + WiX）
        run: choco install nsis wixtoolset --no-progress -y

      # 注意：这里**不能**用 `wails3 task windows:package`。package 带 build 依赖，而
      # `go build -o bin/mandaryn.exe` 会把上面刚取回的已签名 exe 覆盖成未签名版本，
      # 结果安装器里装的是没有签名的 exe（签名段全部白做）。
      # create:* 不依赖 build，只要求 bin/ 里已有 exe，正是为这条流程准备的。
      # 任务全名带平台前缀（windows:），没有去前缀的别名。
      - name: 打三产物
        shell: bash
        run: |
          set -euo pipefail
          wails3 task windows:create:nsis:installer INSTALL_SCOPE=machine
          wails3 task windows:create:msi:package
          wails3 task windows:create:portable:zip

      - name: 校验产物齐全
        shell: bash
        run: |
          set -euo pipefail
          for f in "bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe" "bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi" \
                   "bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-portable.zip"; do
            test -f "$f" || { echo "::error::缺少产物 $f"; exit 1; }
          done
          ls -lh bin/*.exe bin/*.msi bin/*.zip

      - name: 上传三产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-unsigned
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-portable.zip

  # ── 4) 签安装器与 MSI（Ubuntu 签名机）──────────────────────────────────────
  sign-installer:
    name: 签安装器与 MSI（Ubuntu 签名机）
    needs: [build, package]
    if: vars.SIGNING_ENABLED == 'true'
    runs-on: [self-hosted, linux, signing]
    timeout-minutes: 20
    environment: signing
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载三产物
        uses: actions/download-artifact@v4
        with: { name: artifacts-unsigned, path: bin }

      # 同一台签名机，与 sign-exe 同样的自检。多次跑预检是幂等的（只读）。
      - name: 环境预检（令牌 / 证书 / 私钥 / 时间戳）
        run: |
          set -euo pipefail
          command -v osslsigncode >/dev/null || { echo "::error::缺少 osslsigncode（apt install osslsigncode）"; exit 1; }
          build/linux/sign.sh --preflight

      - name: 签安装器与 MSI
        run: |
          set -euo pipefail
          build/linux/sign.sh --target installer --input bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe
          build/linux/sign.sh --target msi       --input bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi
          # 便携 zip 不单独签：它装的是已签过的 exe，Authenticode 签的是 PE 文件本身

      - name: 上传已签名产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-signed
          retention-days: 7
          if-no-files-found: error
          path: |
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-portable.zip

  # ── 5) 发布：SHA256SUMS（在签名之后）+ 草稿 Release ───────────────────────
  publish:
    name: 发布（草稿 Release）
    needs: [build, package, sign-installer]
    # always()：sign-installer 被跳过（未启用签名）时也要发布。
    # 但「跳过」与「失败」必须区别对待 —— 见下方拒绝发布的步骤。
    if: always() && needs.package.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 启用了签名但签名失败时，绝不能拿未签名产物去发版：
      # 那样流程"看起来"跑完了，发出去的却是未签名包（用户的 SmartScreen 提示照旧）。
      - name: 拒绝发布（启用了签名但签名失败）
        if: vars.SIGNING_ENABLED == 'true' && needs.sign-installer.result != 'success'
        run: |
          echo "::error::SIGNING_ENABLED=true 但签名作业结果=${{ needs.sign-installer.result }}，拒绝发布未签名产物。"
          echo "请修好签名（在签名机跑 build/linux/sign.sh --preflight 逐项排查）后重跑。"
          exit 1

      - name: 下载已签名产物
        if: needs.sign-installer.result == 'success'
        uses: actions/download-artifact@v4
        with: { name: artifacts-signed, path: bin }

      - name: 下载未签名产物（未启用签名时）
        if: needs.sign-installer.result == 'skipped'
        uses: actions/download-artifact@v4
        with: { name: artifacts-unsigned, path: bin }

      # 签了名就要证明"确实带签名"：sign.sh 的完整验签是在签名机上做的，
      # 这里对**最终待发布文件**再独立验一次，防的是产物在上传/下载中转过程中丢签名。
      #
      # 用 -ignore-timestamp，理由不是放松标准，而是这条闸门的目的：证明「文件确实被
      # 我们的证书签过且字节未变」。而时间戳验签会连带要求 TSA 证书链可被信任
      # （osslsigncode 的 DIAGNOSTICS 明说缺 TSA 根证书会导致验签失败），那与本闸门
      # 无关，并且会把签名完全正确的产物误判为失败 → 卡住发版。
      # 时间戳本身单独断言存在，避免"没打时间戳"这种情况被悄悄放过。
      - name: 校验产物确实带 Authenticode 签名
        if: needs.sign-installer.result == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          rc=0
          for f in bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi; do
            echo "── verify $f"
            log="$RUNNER_TEMP/verify-$(basename "$f").log"
            if ! osslsigncode verify -ignore-timestamp -in "$f" > "$log" 2>&1; then
              echo "::error::$f 没有有效 Authenticode 签名（或签名者证书链不可用）"
              sed -n '1,40p' "$log"
              rc=1
              continue
            fi
            grep -qi "timestamp" "$log" || {
              echo "::error::$f 缺少时间戳：证书到期后该签名会失效，无法长期分发"
              rc=1
              continue
            }
            echo "   OK（签名有效，含时间戳）"
          done
          exit "$rc"

      # 校验和必须在**所有签名之后**生成：签名改变文件字节（含时间戳），先算必然对不上
      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd bin
          sha256sum "mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe" \
                    "mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi" \
                    "mandaryn-${{ needs.build.outputs.version }}-windows-amd64-portable.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      # 独立于 CA 的第二层校验：证书回答"我是谁"，minisign 回答"这份文件出自本仓库且未被改"。
      # 证书每年轮换且换证会重置发布信誉，minisign 公钥可以长期不变。
      - name: 用 minisign 签校验和（可选，配 MINISIGN_ENABLED 变量 + 密钥后生效）
        if: vars.MINISIGN_ENABLED == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MINISIGN_SECRET_KEY"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m bin/SHA256SUMS.txt \
                   -x bin/SHA256SUMS.txt.minisig
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: 创建草稿 Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Mandaryn ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            ## 安装方式（Windows）

            | 产物 | 适用场景 |
            |------|----------|
            | `mandaryn-*-windows-amd64-installer.exe` | 普通用户：双击安装，自动创建桌面与开始菜单快捷方式 |
            | `mandaryn-*-windows-amd64.msi` | 企业部署（GPO / SCCM / Intune）。**与 NSIS 二选一**，不要同时安装 |
            | `mandaryn-*-windows-amd64-portable.zip` | 免安装：解压即用，数据写在解压目录的 `data\` 内 |

            安装器与 MSI 二选一：两者各自注册卸载项，同时安装会出现两个「Mandaryn」。

            ## 完整性校验

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            ## 关于代码签名

            ${{ needs.sign-installer.result == 'success' && '本版本已使用 Authenticode 证书签名。' || '本版本**未签名**：首次运行可能出现 SmartScreen「未识别的应用」提示。请先核对上面的 SHA256 再选择「仍要运行」。' }}

            > 卸载不会删除你的数据（`%AppData%\Mandaryn` 或便携包内的 `data\`）。
          files: |
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-installer.exe
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64.msi
            bin/mandaryn-${{ needs.build.outputs.version }}-windows-amd64-portable.zip
            bin/SHA256SUMS.txt
            bin/SHA256SUMS.txt.minisig
